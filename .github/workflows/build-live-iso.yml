name: Build Community Grid OS live ISO (experimental)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/community-grid-os
    paths:
      - 'distro/**'
      - 'runtime/**'
      - '.github/workflows/build-live-iso.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git live-build debootstrap xorriso squashfs-tools ca-certificates curl
      - uses: actions/checkout@v4
      - name: Build ISO
        run: bash distro/build-iso.sh
      - name: Inspect ISO for embedded SSH credentials
        run: |
          set -eu
          image=.build/community-grid-live/live-image-amd64.hybrid.iso
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          xorriso -osirrox on -indev "$image" -extract /live "$scratch/live"
          found=0
          for filesystem in "$scratch"/live/*.squashfs; do
            [ -f "$filesystem" ] || continue
            found=1
            unsquashfs -ll "$filesystem" > "$scratch/paths"
            # A bare .ssh directory contains no credentials. Reject entries below it
            # and any .ssh symlink or file, along with standalone key paths.
            if grep -E '(/\.ssh/|/authorized_keys2?( -> .*)?$|/ssh_host_[^/[:space:]]+_key([.][^/[:space:]]+)?( -> .*)?$|/id_(rsa|ed25519|ecdsa|dsa)([.]pub)?( -> .*)?$)|^[^d].*/\.ssh( -> .*)?
              echo 'Unexpected SSH credential path in live filesystem' >&2
              exit 1
            fi
            grep -E '/etc/systemd/system/ssh[.]service -> /dev/null$' "$scratch/paths"
            grep -E '/etc/systemd/system/ssh[.]socket -> /dev/null$' "$scratch/paths"
            grep -E '/usr/local/sbin/start-supervisor-ssh$' "$scratch/paths"
          done
          test "$found" -eq 1
      - name: SHA256
        run: |
          cd .build/community-grid-live
          sha256sum live-image-amd64.hybrid.iso > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: community-grid-os-amd64-live
          path: |
            .build/community-grid-live/live-image-amd64.hybrid.iso
            .build/community-grid-live/SHA256SUMS
          retention-days: 7
 "$scratch/paths"; then
              echo 'Unexpected SSH credential path in live filesystem' >&2
              exit 1
            fi
            grep -E '/etc/systemd/system/ssh[.]service -> /dev/null$' "$scratch/paths"
            grep -E '/etc/systemd/system/ssh[.]socket -> /dev/null$' "$scratch/paths"
            grep -E '/usr/local/sbin/start-supervisor-ssh$' "$scratch/paths"
          done
          test "$found" -eq 1
      - name: SHA256
        run: |
          cd .build/community-grid-live
          sha256sum live-image-amd64.hybrid.iso > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: community-grid-os-amd64-live
          path: |
            .build/community-grid-live/live-image-amd64.hybrid.iso
            .build/community-grid-live/SHA256SUMS
          retention-days: 7
