name: CGOS M2 Task 5B build and latency diagnostic
on:
  push:
    branches: ['cgos/0.1-m2-rpc-optimization']
    paths: ['distro/**', 'runtime/community_grid/**', '.github/workflows/diagnose-cgos-m2-rpc.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.image.outputs.artifact-id }}
      artifact-digest: ${{ steps.image.outputs.artifact-digest }}
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install disposable builder dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git python3 live-build debootstrap xorriso squashfs-tools ca-certificates
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source and run regression suite
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          PYTHONPATH=runtime python3 -B -m unittest discover -s runtime/tests -v
          for script in distro/build-iso.sh distro/m1/build.sh distro/m2/*.hook.chroot distro/m2/cgos-worker-relay distro/m2/cgos-check-worker-sshd; do bash -n "$script"; done
      - name: Build and check image contents
        shell: bash
        run: |
          set -euo pipefail
          bash distro/build-iso.sh m2
          cd .build/cgos-m2
          test "$(cat manifest/source-commit.txt)" = "$GITHUB_SHA"
          test ! -s manifest/source-status.txt
          sha256sum -c SHA256SUMS
          xorriso -indev live-image-amd64.hybrid.iso -report_el_torito plain > manifest/el-torito.txt
          grep -E 'El Torito boot img.*BIOS' manifest/el-torito.txt
          grep -E 'El Torito boot img.*UEFI' manifest/el-torito.txt
          scratch=$(mktemp -d)
          xorriso -osirrox on -indev live-image-amd64.hybrid.iso -extract /live "$scratch/live"
          unsquashfs -ll "$scratch"/live/filesystem.squashfs > manifest/image-files.txt
          if grep -E '(/\.ssh/|/authorized_keys2?($| ->)|/ssh_host_.*_key(\.pub)?($| ->)|/etc/cgos/distributed/)' manifest/image-files.txt; then
            echo 'Unexpected embedded SSH or enrollment material' >&2
            exit 1
          fi
          for unit in cgos-coordinator cgos-worker cgos-worker-relay; do
            grep -F "/etc/systemd/system/$unit.service" manifest/image-files.txt
            if grep -E "/[^ ]+\.wants/$unit\.service( |$)" manifest/image-files.txt; then exit 1; fi
          done
          grep -F '/etc/systemd/system/ssh.service -> /dev/null' manifest/image-files.txt
          grep -F '/etc/systemd/system/ssh.socket -> /dev/null' manifest/image-files.txt
          dpkg-query -W > manifest/builder-all-packages.txt
          mkdir -p "$GITHUB_WORKSPACE/m2-artifact"
          cp live-image-amd64.hybrid.iso SHA256SUMS "$GITHUB_WORKSPACE/m2-artifact/"
          cp -r manifest "$GITHUB_WORKSPACE/m2-artifact/"
      - uses: actions/upload-artifact@v4
        id: image
        with:
          name: cgos-0.1-m2-amd64-${{ github.sha }}
          path: m2-artifact/
          if-no-files-found: error
  diagnostic:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve and verify the exact build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_ID: ${{ needs.build.outputs.artifact-id }}
          BUNDLE_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          mkdir -p evidence iso
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BUNDLE_ID" > evidence/iso-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BUNDLE_ID/zip" > original.zip
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,zipfile
          meta=json.loads(pathlib.Path('evidence/iso-artifact.json').read_text())
          expected=os.environ['GITHUB_SHA']
          assert meta['workflow_run']['head_sha']==expected
          assert meta['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID'])
          assert meta['id']==int(os.environ['BUNDLE_ID']) and not meta['expired']
          assert meta['name']=='cgos-0.1-m2-amd64-'+expected
          with open('original.zip','rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          assert digest==os.environ['BUNDLE_DIGEST'].removeprefix('sha256:')
          assert meta.get('digest') in (None,'sha256:'+digest)
          with zipfile.ZipFile('original.zip') as z:
              names=z.namelist()
              assert len(names)==len(set(names))
              assert sum(i.file_size for i in z.infolist())<700_000_000
              assert all(re.fullmatch(r'(live-image-amd64\.hybrid\.iso|SHA256SUMS|manifest/[A-Za-z0-9_.+-]+)',n) for n in names)
              z.extractall('iso')
          PY
          test "$(cat iso/manifest/source-commit.txt)" = "$GITHUB_SHA"
          test ! -s iso/manifest/source-status.txt
          sha256sum -c iso/manifest/build-inputs.SHA256SUMS
          (cd iso && sha256sum -c SHA256SUMS)
          cp iso/SHA256SUMS evidence/ISO-SHA256SUMS
          cp iso/manifest/source-commit.txt evidence/source-commit.txt
      - name: Install disposable VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 seabios ovmf xorriso openssh-client
      - name: Trace one graph in two disposable guests (not acceptance)
        run: |
          bash -n ci/m2/check-ssh.sh
          sh -n ci/m2/setup-guest.sh
          timeout --kill-after=15s 620s python3 -B ci/m2/boot-and-test.py --diagnostic
      - name: Extract diagnostic trace
        if: always()
        run: |
          mkdir -p evidence
          if test -f evidence/A/command-serial.log; then
            grep -a '^M2_DIAG_' evidence/A/command-serial.log > evidence/diagnostic.log || :
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cgos-m2-task5b-diagnostic-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
