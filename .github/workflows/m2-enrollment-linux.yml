name: CGOS M2 enrollment isolated Linux validation
on:
  push:
    branches: ['cgos/0.1-m2-enrollment-ci']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b4d51efa9cce6f851e484e499f8e1a24944e0453
          persist-credentials: false
      - name: Stage and validate exact candidate
        run: |
          set -euo pipefail
          mkdir -p evidence runtime/tests/integration
          cat > runtime/community_grid/enrollment.py <<'CGOS_FILE_0'
          """Explicit SSH worker enrollment and nonblocking coordinator adapters."""
          import base64
          from concurrent.futures import ThreadPoolExecutor
          from functools import partial
          import hashlib
          import ipaddress
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import tempfile
          import time
          
          from .graph import digest, encode
          from .physical import ssh_transport
          
          OPS = {"text.normalize": 1, "text.sha256": 1}
          MAX_PEERS = 8
          PROBE_INTERVAL = 2
          OFFLINE_AFTER = 10
          
          
          def read_manifest(path):
              flags = os.O_RDONLY | getattr(os, "O_NONBLOCK", 0) | getattr(os, "O_NOFOLLOW", 0)
              with os.fdopen(os.open(path, flags), "rb") as stream:
                  info = os.fstat(stream.fileno())
                  if not stat.S_ISREG(info.st_mode):
                      raise ValueError("Enrollment manifest must be a regular file")
                  if os.name == "posix" and (info.st_mode & 0o022 or info.st_uid not in (0, os.geteuid())):
                      raise PermissionError("Enrollment manifest must be controlled by the administrator")
                  raw = stream.read(65537)
              if len(raw) > 65536:
                  raise ValueError("Enrollment manifest exceeds limit")
              data = json.loads(raw)
              if not isinstance(data, dict) or set(data) != {"version", "workers"} or type(data["version"]) is not int or data["version"] != 1:
                  raise ValueError("Unsupported enrollment format")
              workers = data["workers"]
              if not isinstance(workers, list) or len(workers) > MAX_PEERS:
                  raise ValueError("Too many enrolled workers")
              enrolled, seen, endpoints = {}, set(), set()
              for entry in workers:
                  if not isinstance(entry, dict) or set(entry) != {
                      "node", "address", "port", "account", "host_key", "fingerprint",
                      "identity_file", "protocols", "operations", "cpu", "memory_mib", "revoked",
                  }:
                      raise ValueError("Invalid enrollment fields")
                  node = entry["node"]
                  if not isinstance(node, str) or not re.fullmatch(r"[a-zA-Z0-9_-]{1,64}", node) or node in seen:
                      raise ValueError("Invalid or duplicate worker ID")
                  seen.add(node)
                  if type(entry["revoked"]) is not bool:
                      raise ValueError("Invalid revocation flag")
                  if entry["revoked"]:
                      continue
                  if not isinstance(entry["address"], str):
                      raise ValueError("Invalid worker address")
                  address = str(ipaddress.IPv4Address(entry["address"]))
                  port, account = entry["port"], entry["account"]
                  if (type(port) is not int or not 1 <= port <= 65535 or not isinstance(account, str)
                          or not re.fullmatch(r"[a-zA-Z_][a-zA-Z0-9_-]{0,31}", account)):
                      raise ValueError("Invalid SSH endpoint")
                  if (address, port) in endpoints:
                      raise ValueError("Enrolled SSH endpoints must be unique")
                  endpoints.add((address, port))
                  key = entry["host_key"]
                  if not isinstance(key, str) or not re.fullmatch(r"ssh-ed25519 [A-Za-z0-9+/=]+", key):
                      raise ValueError("Expected an Ed25519 public key without comment")
                  binary = base64.b64decode(key.split()[1], validate=True)
                  if not binary.startswith(b"\x00\x00\x00\x0bssh-ed25519\x00\x00\x00\x20") or len(binary) != 51:
                      raise ValueError("Invalid Ed25519 public key")
                  fingerprint = "SHA256:" + base64.b64encode(hashlib.sha256(binary).digest()).decode().rstrip("=")
                  if entry["fingerprint"] != fingerprint:
                      raise ValueError("Independently recorded host-key fingerprint does not match")
                  if not isinstance(entry["identity_file"], str) or any(c in entry["identity_file"] for c in "\r\n"):
                      raise ValueError("Invalid identity path")
                  identity = Path(entry["identity_file"])
                  if not identity.is_absolute() or not identity.is_file():
                      raise ValueError("Expected existing absolute SSH identity path")
                  if (entry["protocols"] != [2] or type(entry["protocols"][0]) is not int
                          or type(entry["cpu"]) is not int or entry["cpu"] != 1
                          or type(entry["memory_mib"]) is not int or not 16 <= entry["memory_mib"] <= 128):
                      raise ValueError("Invalid protocol or resource policy")
                  ops = entry["operations"]
                  if not isinstance(ops, dict) or not ops or any(
                      k not in OPS or type(v) is not int or v != OPS[k] for k, v in ops.items()
                  ):
                      raise ValueError("Invalid operation policy")
                  enrolled[node] = dict(entry, address=address)
              return enrolled
          
          
          class Peer:
              """Scheduler-facing view. Only its executor thread performs SSH."""
          
              def __init__(self, entry, transport, pool, clock=time.monotonic):
                  self.policy, self.transport, self.pool, self.clock = entry, transport, pool, clock
                  self.capabilities = None
                  self.boot_id = None
                  self.last_seen = None
                  self.next_probe = 0
                  self.pending = None
                  self.reply = None
          
              def online(self):
                  return (self.capabilities is not None and self.last_seen is not None
                          and self.clock() - self.last_seen < OFFLINE_AFTER)
          
              def _send(self, action, lease=None, **fields):
                  request = dict(version=2, action=action, **fields)
                  if lease is not None:
                      request["lease"] = lease
                  self.pending = (action, lease, self.pool.submit(self.transport, request))
          
              def _probe(self, response):
                  if (response.get("node") != self.policy["node"]
                          or not isinstance(response.get("worker_boot_id"), str)
                          or not response["worker_boot_id"] or len(response["worker_boot_id"]) > 256
                          or not isinstance(response.get("architecture"), str)
                          or not response["architecture"] or len(response["architecture"]) > 64
                          or response.get("backend") != "cpu"
                          or not isinstance(response.get("operation_versions"), dict)):
                      raise ValueError("Unexpected worker capability identity")
                  for key in ("slots", "cpu", "ram_mib"):
                      if type(response.get(key)) is not int or response[key] <= 0:
                          raise ValueError("Invalid worker capability limits")
                  ops = {k: v for k, v in self.policy["operations"].items()
                         if type(response["operation_versions"].get(k)) is int
                         and response["operation_versions"][k] == v}
                  boot = response["worker_boot_id"]
                  if self.boot_id != boot:
                      self.reply = None
                  self.boot_id = boot
                  self.capabilities = dict(architecture=response["architecture"], backend="cpu", slots=1, cpu=1,
                                           ram_mib=min(response["ram_mib"], self.policy["memory_mib"]),
                                           operation_versions=ops)
                  self.last_seen = self.clock()
          
              def poll(self):
                  if self.pending is not None and self.pending[2].done():
                      action, lease, future = self.pending
                      self.pending = None
                      try:
                          response = future.result()
                          if not isinstance(response, dict) or type(response.get("version")) is not int or response["version"] != 2:
                              raise ValueError("Incompatible worker protocol")
                          if action == "probe":
                              self._probe(response)
                          elif encode(response.get("lease")) != encode(lease):
                              raise ValueError("Invalid worker lease response")
                          elif response.get("status") not in {
                              "missing", "queued", "running", "completed", "failed", "cancelled", "timed-out"
                          }:
                              raise ValueError("Invalid worker status")
                          elif action in ("submit", "cancel") and response["status"] == "missing":
                              raise ValueError("Worker did not acknowledge request")
                          else:
                              if response["status"] == "completed":
                                  if type(response.get("value")) is not str or not isinstance(response.get("sha256"), str):
                                      raise ValueError("Invalid worker result")
                                  response = dict(response, data=encode(response["value"]))
                              self.reply = (lease, response)
                      except ConnectionError:
                          if lease is not None:
                              self.reply = (lease, ConnectionError("Worker exchange failed"))
                      except (ValueError, TypeError, KeyError):
                          if action == "probe":
                              self.capabilities = None
                          else:
                              self.reply = (lease, ValueError("Worker rejected or returned an invalid response"))
                      if action == "probe":
                          self.next_probe = self.clock() + PROBE_INTERVAL
                  if self.pending is None and self.clock() >= self.next_probe and (self.reply is None or not self.online()):
                      if not self.online():
                          self.reply = None
                      self._send("probe")
          
              def eligible(self, unit):
                  return (self.online() and unit["op"] in self.capabilities["operation_versions"]
                          and unit["cpu"] <= self.capabilities["cpu"] and unit["ram_mib"] <= self.capabilities["ram_mib"])
          
              def lease_status(self, lease):
                  if not self.online() or self.boot_id != lease["worker_boot_id"]:
                      raise ConnectionError("Worker offline or boot identity changed")
                  if self.reply is not None and self.reply[0] == lease:
                      _, response = self.reply
                      self.reply = None
                      if isinstance(response, Exception):
                          raise response
                      return response
                  self._request("status", lease)
          
              def _request(self, action, lease, **fields):
                  if not self.online() or self.boot_id != lease["worker_boot_id"] or self.pending is not None:
                      raise ConnectionError("Worker unavailable or exchange pending")
                  if self.reply is not None:
                      self.reply = None
                  self._send(action, lease, **fields)
                  raise ConnectionError("Worker exchange pending")
          
              def lease_dispatch(self, lease, value):
                  if not self.online():
                      raise ConnectionError("Worker offline")
                  unit = {"op": lease["operation"], "cpu": lease["cpu"], "ram_mib": lease["ram_mib"]}
                  if not self.eligible(unit):
                      raise ValueError("Lease exceeds enrollment policy")
                  self._request("submit", lease, value=value)
          
              def lease_cancel(self, lease):
                  # Let the scheduler consume the asynchronous cancel response as status.
                  if self.reply is not None and self.reply[0] == lease:
                      return
                  self._request("cancel", lease)
          
              def describe(self):
                  return {"boot_id": self.boot_id, "online": self.online(), "capabilities": self.capabilities}
          
          
          class Registry:
              def __init__(self, path, state, *, transport_factory=partial(ssh_transport, enrolled=True), clock=time.monotonic):
                  self.path, self.state, self.clock = path, state, clock
                  self.factory = transport_factory
                  self.peers = {}
                  self.pool = ThreadPoolExecutor(max_workers=MAX_PEERS)
                  self.pin_directory = tempfile.TemporaryDirectory(prefix="worker-pins-", dir=state)
                  self.retired = {}
          
              def load(self, graphs):
                  entries = read_manifest(self.path)
                  self.apply(entries, graphs)
          
              def apply(self, entries, graphs):
                  # Persist revocations before allowing any reply from the replacement map.
                  for node in list(self.retired):
                      if self.retired[node].done():
                          self.retired.pop(node)
                  replacing = {node: peer.pending[2] for node, peer in self.peers.items()
                               if entries.get(node) != peer.policy and peer.pending is not None
                               and not peer.pending[2].done()}
                  if len(self.retired.keys() | replacing.keys()) > MAX_PEERS:
                      raise ValueError("Too many retired worker exchanges; retry reload after they finish")
                  new = {}
                  for node, entry in entries.items():
                      old = self.peers.get(node)
                      if old is not None and old.policy == entry:
                          new[node] = old
                          continue
                      endpoint = f'[{entry["address"]}]:{entry["port"]}'
                      # OpenSSH uses the bare address on the default port.
                      if entry["port"] == 22:
                          endpoint = entry["address"]
                      pin = Path(self.pin_directory.name) / f"{node}-{digest(encode(entry))}"
                      pin.write_text(f'{endpoint} {entry["host_key"]}\n', encoding="ascii")
                      transport = self.factory(entry["address"], entry["account"], entry["identity_file"], pin, entry["port"])
                      new[node] = Peer(entry, transport, self.pool, self.clock)
                  graphs.set_enrollment({node: digest(encode(entry)) for node, entry in entries.items()})
                  self.retired.update(replacing)
                  self.peers.clear()
                  self.peers.update(new)
          
              def tick(self):
                  for node in list(self.retired):
                      if self.retired[node].done():
                          self.retired.pop(node)
                  for node, peer in self.peers.items():
                      if node not in self.retired:
                          peer.poll()
          
              def close(self):
                  self.pool.shutdown(wait=True, cancel_futures=True)
                  self.pin_directory.cleanup()
          CGOS_FILE_0
          cat > runtime/community_grid/graph.py <<'CGOS_FILE_1'
          """Phase 1A graph API and reference scheduler (single coordinator owner)."""
          from contextlib import closing
          import hashlib
          import json
          import sqlite3
          import time
          import uuid
          
          
          def encode(value):
              return json.dumps(value, sort_keys=True, separators=(",", ":"), allow_nan=False).encode()
          
          
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          
          
          def aggregate(value):
              return {"items": value}
          
          
          OPERATIONS = {
              "text.normalize": (str, str, lambda value: " ".join(value.split())),
              "text.sha256": (str, str, lambda value: digest(value.encode())),
              "data.aggregate": (list, dict, aggregate),
          }
          TYPES = {str: "text", list: "array", dict: "object"}
          TERMINAL = {"completed", "failed", "cancelled", "timed-out", "blocked"}
          
          
          def validate(graph):
              duration = graph.get("timeout", 120)
              if type(duration) is not int or not 1 <= duration <= 300:
                  raise ValueError("Graph timeout must be 1Ã¢â‚¬â€œ300 seconds")
              if type(graph["version"]) is not int or graph["version"] != 1 or not isinstance(graph["owner"], str) or not graph["owner"].strip():
                  raise ValueError("Invalid version or owner")
              if not isinstance(graph["id"], str) or not graph["id"]:
                  raise ValueError("Invalid graph identity")
              units = graph["units"]
              if not isinstance(units, dict) or not 1 <= len(units) <= 32:
                  raise ValueError("Expected 1Ã¢â‚¬â€œ32 units")
              visited, active = set(), set()
          
              def visit(name):
                  if name in active or name not in units:
                      raise ValueError("Cyclic or missing dependency")
                  if name in visited:
                      return
                  active.add(name)
                  unit = units[name]
                  if unit["op"] not in OPERATIONS:
                      raise ValueError("Unknown operation")
                  source, target, _ = OPERATIONS[unit["op"]]
                  if unit["input_type"] != TYPES[source] or unit["output_type"] != TYPES[target]:
                      raise ValueError("Invalid operation types")
                  dependencies = unit["depends"]
                  if not isinstance(dependencies, list) or len(set(dependencies)) != len(dependencies):
                      raise ValueError("Invalid dependencies")
                  for dep in dependencies:
                      visit(dep)
                  if "from" in unit:
                      parent = unit["from"]
                      if "value" in unit or parent not in dependencies or units[parent]["output_type"] != unit["input_type"]:
                          raise ValueError("Incompatible input reference")
                  elif type(unit["value"]) is not source:
                      raise ValueError("Invalid literal input type")
                  if not isinstance(unit["nodes"], list) or not unit["nodes"] or not all(
                      isinstance(node, str) and node for node in unit["nodes"]
                  ):
                      raise ValueError("Expected eligible nodes")
                  for key, hi in (("cpu", 64), ("ram_mib", 1048576), ("timeout", 300), ("attempts", 3)):
                      if type(unit[key]) is not int or not 1 <= unit[key] <= hi:
                          raise ValueError(f"Invalid {key}")
                  if unit["side_effects"] != "none":
                      raise ValueError("Only pure operations are supported")
                  active.remove(name)
                  visited.add(name)
          
              for name in units:
                  visit(name)
          
          
          class GraphRuntime:
              def __init__(self, path, nodes, clock=None, *, coordinator_boot_id=None,
                           lease_seconds=15, worker_memory_mib=128):
                  if coordinator_boot_id is not None and (not isinstance(coordinator_boot_id, str)
                                                          or not coordinator_boot_id):
                      raise ValueError("Invalid coordinator boot ID")
                  if type(lease_seconds) is not int or not 1 <= lease_seconds <= 300:
                      raise ValueError("Invalid lease duration")
                  if type(worker_memory_mib) is not int or worker_memory_mib < 1:
                      raise ValueError("Invalid worker memory budget")
                  self.path, self.nodes = path, nodes
                  self.boot_id = coordinator_boot_id
                  self.clock = clock or (time.monotonic if self.boot_id else time.time)
                  self.lease_seconds = lease_seconds
                  self.worker_memory_mib = worker_memory_mib
                  with closing(sqlite3.connect(path)) as db, db:
                      db.executescript("""
                          CREATE TABLE IF NOT EXISTS graphs(id TEXT PRIMARY KEY, state BLOB NOT NULL);
                          CREATE TABLE IF NOT EXISTS artifacts(hash TEXT PRIMARY KEY, data BLOB NOT NULL);
                      """)
                      if self.boot_id:
                          db.executescript("""
                              CREATE TABLE IF NOT EXISTS scheduler_epoch(
                                  singleton INTEGER PRIMARY KEY CHECK(singleton=1), boot_id TEXT NOT NULL);
                              CREATE TABLE IF NOT EXISTS lease_quarantine(
                                  attempt TEXT PRIMARY KEY, node TEXT NOT NULL, lease BLOB NOT NULL);
                          """)
                          db.execute("BEGIN IMMEDIATE")
                          epoch = db.execute("SELECT boot_id FROM scheduler_epoch").fetchone()
                          if epoch != (self.boot_id,):
                              for (raw,) in db.execute("SELECT state FROM graphs").fetchall():
                                  state = json.loads(raw)
                                  if not state.get("coordinator_boot_id"):
                                      continue
                                  for record in state["units"].values():
                                      if record["status"] == "assigned":
                                          self._quarantine(db, record["lease"])
                                          record["history"][-1]["outcome"] = "coordinator-restarted"
                                      if record["status"] not in TERMINAL:
                                          record["status"] = "timed-out"
                                  self._save(db, state)
                              db.execute("INSERT OR REPLACE INTO scheduler_epoch VALUES (1, ?)",
                                         (self.boot_id,))
          
              def set_enrollment(self, enrollment):
                  """Fence leases transactionally when administrator trust changes."""
                  if not self.boot_id:
                      raise ValueError("Enrollment requires lease mode")
                  with closing(sqlite3.connect(self.path)) as db, db:
                      db.execute("BEGIN IMMEDIATE")
                      self._assert_epoch(db)
                      db.execute("CREATE TABLE IF NOT EXISTS enrollment(node TEXT PRIMARY KEY, fingerprint TEXT NOT NULL)")
                      previous = dict(db.execute("SELECT node,fingerprint FROM enrollment"))
                      changed = {node for node, fingerprint in previous.items() if enrollment.get(node) != fingerprint}
                      for (raw,) in db.execute("SELECT state FROM graphs").fetchall():
                          state = json.loads(raw)
                          if state.get("coordinator_boot_id") != self.boot_id:
                              continue
                          dirty = False
                          for name, record in state["units"].items():
                              if record["status"] != "assigned" or record["node"] not in changed:
                                  continue
                              self._quarantine(db, record["lease"])
                              record["history"][-1]["outcome"] = "enrollment-revoked"
                              limit = state["graph"]["units"][name]["attempts"]
                              record["status"] = ("cancelled" if record.get("cancel_requested") else
                                                  "waiting" if record["lease"]["generation"] < limit
                                                  and self.clock() < state["deadline"] else "failed")
                              dirty = True
                          if dirty:
                              self._save(db, state)
                      db.execute("DELETE FROM enrollment")
                      db.executemany("INSERT INTO enrollment VALUES (?,?)", enrollment.items())
          
              def _assert_epoch(self, db):
                  if self.boot_id and db.execute("SELECT boot_id FROM scheduler_epoch").fetchone() != (self.boot_id,):
                      raise RuntimeError("Coordinator boot identity is fenced")
          
              def _quarantine(self, db, lease):
                  db.execute("INSERT OR IGNORE INTO lease_quarantine VALUES (?, ?, ?)",
                             (lease["attempt"], lease["node"], encode(lease)))
          
              def _load(self, db, graph_id, owner):
                  self._assert_epoch(db)
                  row = db.execute("SELECT state FROM graphs WHERE id=?", (graph_id,)).fetchone()
                  if (row is None or (state := json.loads(row[0]))["graph"]["owner"] != owner
                          or bool(state.get("coordinator_boot_id")) != bool(self.boot_id)):
                      raise KeyError(graph_id)
                  return state
          
              def submit(self, graph, owner):
                  validate(graph)
                  if graph["owner"] != owner:
                      raise PermissionError("Owner mismatch")
                  if len(encode(graph)) > 65536:
                      raise ValueError("Graph exceeds 64 KiB")
                  with closing(sqlite3.connect(self.path)) as db, db:
                      db.execute("BEGIN IMMEDIATE")
                      self._assert_epoch(db)
                      row = db.execute("SELECT state FROM graphs WHERE id=?", (graph["id"],)).fetchone()
                      if row:
                          previous = json.loads(row[0])
                          if previous["graph"] != graph or bool(previous.get("coordinator_boot_id")) != bool(self.boot_id):
                              raise ValueError("Graph ID conflict")
                      else:
                          state = {"graph": graph, "deadline": self.clock() + graph.get("timeout", 120),
                                   "units": {name: {"status": "waiting", "history": []}
                                                             for name in graph["units"]}}
                          if self.boot_id:
                              state["coordinator_boot_id"] = self.boot_id
                          db.execute("INSERT INTO graphs VALUES (?,?)", (graph["id"], encode(state)))
                  return graph["id"]
          
              def status(self, graph_id, owner):
                  with closing(sqlite3.connect(self.path)) as db:
                      return self._load(db, graph_id, owner)
          
              def _save(self, db, state):
                  db.execute("UPDATE graphs SET state=? WHERE id=?", (encode(state), state["graph"]["id"]))
          
              def _artifact(self, db, checksum):
                  row = db.execute("SELECT data FROM artifacts WHERE hash=?", (checksum,)).fetchone()
                  if row is None or digest(row[0]) != checksum:
                      raise ValueError("Missing or invalid artifact")
                  return json.loads(row[0])
          
              def result(self, graph_id, owner, unit):
                  with closing(sqlite3.connect(self.path)) as db:
                      record = self._load(db, graph_id, owner)["units"][unit]
                      if record["status"] != "completed":
                          raise ValueError("Unit has no published result")
                      return self._artifact(db, record["result"]["sha256"])
          
              def cancel(self, graph_id, owner):
                  with closing(sqlite3.connect(self.path)) as db, db:
                      db.execute("BEGIN IMMEDIATE")
                      state = self._load(db, graph_id, owner)
                      for record in state["units"].values():
                          if record["status"] not in TERMINAL:
                              record["cancel_requested"] = True
                              if record["status"] == "waiting":
                                  record["status"] = "cancelled"
                      self._save(db, state)
          
              def publish(self, graph_id, owner, unit, attempt, data, checksum, *, lease=None, worker_id=None):
                  with closing(sqlite3.connect(self.path)) as db, db:
                      db.execute("BEGIN IMMEDIATE")
                      state = self._load(db, graph_id, owner)
                      record = state["units"][unit]
                      if (record["status"] != "assigned" or record["attempt"] != attempt
                              or record.get("cancel_requested") or self.clock() >= record["deadline"]):
                          return False
                      if self.boot_id:
                          expected_lease = record["lease"]
                          assigned_node = self.nodes.get(expected_lease["node"])
                          if (state["coordinator_boot_id"] != self.boot_id
                                  or worker_id != expected_lease["node"]
                                  or encode(lease) != encode(expected_lease)
                                  or getattr(assigned_node, "boot_id", None) != expected_lease["worker_boot_id"]
                                  or self.clock() >= state["deadline"]
                                  or digest(encode(record["input"])) != expected_lease["input_digest"]):
                              return False
                      expected = OPERATIONS[state["graph"]["units"][unit]["op"]][1]
                      if len(data) > 65536 or digest(data) != checksum or type(json.loads(data)) is not expected:
                          raise ValueError("Invalid result manifest")
                      operation = state["graph"]["units"][unit]["op"]
                      if data != encode(OPERATIONS[operation][2](record["input"])):
                          raise ValueError("Result differs from trusted local execution")
                      if self.boot_id and self.clock() >= min(state["deadline"], record["deadline"]):
                          return False
                      db.execute("INSERT OR IGNORE INTO artifacts VALUES (?,?)", (checksum, data))
                      self._artifact(db, checksum)
                      record.update(status="completed", result={"attempt": attempt, "sha256": checksum,
                                                                 "size": len(data), "type": TYPES[expected]})
                      record["history"][-1]["outcome"] = "completed"
                      self._save(db, state)
                      return True
          
              def tick(self, graph_id, owner):
                  state = self.status(graph_id, owner)
                  if self.boot_id:
                      self.reconcile_quarantine()
                  for name, record in state["units"].items():
                      if record["status"] == "assigned" or record.get("cleanup_pending"):
                          if self.boot_id:
                              self._reconcile_lease(graph_id, owner, name, record)
                          else:
                              self._reconcile(graph_id, owner, name, record)
                  state = self.status(graph_id, owner)
                  eligible = {
                      name: [node for node in sorted(set(unit["nodes"]))
                             if node in self.nodes and self._eligible(self.nodes[node], unit)]
                      for name, unit in state["graph"]["units"].items()
                      if state["units"][name]["status"] == "waiting"
