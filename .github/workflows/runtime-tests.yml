name: Runtime unit tests
on:
  push:
    branches:
      - feature/community-grid-os
  pull_request:
    paths:
      - 'runtime/**'
      - '.github/workflows/runtime-tests.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run runtime unit tests
        run: PYTHONPATH=runtime python -m unittest discover -s runtime/tests -v
