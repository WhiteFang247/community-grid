name: Test the verified CGOS 0.1-M2 ISO in two guests
on:
  push:
    branches: ['cgos/0.1-m2-two-vm-acceptance']
    paths: ['ci/m2/**', '.github/workflows/test-cgos-m2-vms.yml']
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve and verify the exact build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ISO_SOURCE: '450536f87f12dd563df88ddc04274cdb0fccdf52'
          ISO_BUILD_RUN: '43764349300'
          BUNDLE_ID: '14182290204'
          BUNDLE_DIGEST: '15a0f2d6c8e788be2beb1896464473c3f0bc46aa1b2893a4566347566d07f296'
        run: |
          set -euo pipefail
          mkdir -p evidence iso
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BUNDLE_ID" > evidence/iso-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BUNDLE_ID/zip" > original.zip
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,zipfile
          meta=json.loads(pathlib.Path('evidence/iso-artifact.json').read_text())
          expected=os.environ['ISO_SOURCE']
          assert meta['workflow_run']['head_sha']==expected
          assert meta['workflow_run']['id']==int(os.environ['ISO_BUILD_RUN'])
          assert meta['id']==int(os.environ['BUNDLE_ID']) and not meta['expired']
          assert meta['name']=='cgos-0.1-m2-amd64-'+expected
          with open('original.zip','rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          assert digest==os.environ['BUNDLE_DIGEST'].removeprefix('sha256:')
          assert meta.get('digest') in (None,'sha256:'+digest)
          with zipfile.ZipFile('original.zip') as z:
              names=z.namelist()
              assert len(names)==len(set(names))
              assert sum(i.file_size for i in z.infolist())<700_000_000
              assert all(re.fullmatch(r'(live-image-amd64\.hybrid\.iso|SHA256SUMS|manifest/[A-Za-z0-9_.+-]+)',n) for n in names)
              z.extractall('iso')
          PY
          test "$(cat iso/manifest/source-commit.txt)" = "$ISO_SOURCE"
          test ! -s iso/manifest/source-status.txt
          git fetch --depth=1 origin "$ISO_SOURCE"
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess
          rev=os.environ['ISO_SOURCE']
          for line in pathlib.Path('iso/manifest/build-inputs.SHA256SUMS').read_text().splitlines():
              expected,path=line.split('  ',1)
              blob=subprocess.check_output(['git','show',rev+':'+path])
              assert hashlib.sha256(blob).hexdigest()==expected,path
          PY
          (cd iso && sha256sum -c SHA256SUMS)
          cp iso/SHA256SUMS evidence/ISO-SHA256SUMS
          cp iso/manifest/source-commit.txt evidence/source-commit.txt
      - name: Install disposable VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 seabios ovmf xorriso openssh-client
      - name: Check guest script syntax
        run: |
          bash -n ci/m2/check-ssh.sh
          sh -n ci/m2/setup-guest.sh
      - name: Boot two guests and exercise the full matrix
        run: timeout --kill-after=15s 1500s python3 -B ci/m2/boot-and-test.py
      - name: Collect trial records and verdict
        if: always()
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json,pathlib
          out=pathlib.Path('evidence')
          serial=out/'A/command-serial.log'
          log=serial.read_text(errors='replace') if serial.exists() else ''
          trials=[json.loads(s.split(' ',1)[1]) for s in log.splitlines() if s.startswith('M2_TRIAL ')]
          with (out/'trials.jsonl').open('w') as f:
              for trial in trials: f.write(json.dumps(trial)+'\n')
          verdicts=[json.loads(s.split(' ',1)[1]) for s in log.splitlines() if s.startswith('M2_VERDICT ')]
          expected=dict(warmup=5,healthy=30,local=30,lost=20,restart=20,offline=20,cancel=20)
          counts={name:sum(t['mode']==name for t in trials) for name in expected}
          valid=bool(verdicts and verdicts[-1]['status']=='PASS' and counts==expected
                     and all(t['status']=='pass' for t in trials))
          verdict={'status':'PASS' if valid else 'NOT ACCEPTED',
                   'completed_trial_counts':counts,'required_trial_counts':expected,
                   'guest_verdict':verdicts[-1] if verdicts else None}
          (out/'verdict.json').write_text(json.dumps(verdict,indent=2)+'\n')
          print(json.dumps(verdict,indent=2))
          if not valid: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cgos-m2-two-vm-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
