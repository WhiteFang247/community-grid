<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Community Grid</title><style>body{font:16px system-ui;background:#0a1522;color:#eaf3f8;max-width:480px;margin:12vh auto;padding:24px}main{background:#112436;padding:30px;border-radius:20px}input,button{display:block;box-sizing:border-box;width:100%;padding:14px;margin:12px 0;border-radius:8px;border:1px solid #547084}button{background:#267b6a;color:white}p{color:#a8c0d1}</style><main><h1>◈ Community Grid</h1><h2>Join this cluster</h2><p>Enter a device name and request approval from the cluster owner.</p><input id="name" placeholder="My phone" maxlength="80"><button id="join">Request connection</button><p id="status">This browser pairing request does not install a mobile worker. Native app installation and deep linking are planned.</p></main><script>document.getElementById('join').onclick=async()=>{const code=new URLSearchParams(location.search).get('code');const device_name=document.getElementById('name').value.trim();if(!code||!device_name){document.getElementById('status').textContent='Missing invitation or device name';return}try{const r=await fetch('/pair/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,device_name})});const data=await r.json();document.getElementById('status').textContent=r.ok?'Request sent. Ask the cluster owner to approve on their laptop.':'Unable to join: '+(data.detail||r.status)}catch(e){document.getElementById('status').textContent='Cannot reach the coordinator. Connect to the same trusted network.'}}</script></html>
